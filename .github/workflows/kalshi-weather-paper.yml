name: Kalshi Weather Paper Scan

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kalshi-weather-paper
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Scan every open daily-high location
        run: python3 automation/kalshi-weather/weather_paper_scanner.py

      - name: Commit audit results
        if: always()
        run: |
          git config user.name "weather-paper-bot"
          git config user.email "weather-paper-bot@users.noreply.github.com"
          git add automation/kalshi-weather/data/latest.json
          for f in signals.jsonl observation_snapshots.jsonl reconciliations.jsonl; do
            if [ -f "automation/kalshi-weather/data/$f" ]; then
              git add "automation/kalshi-weather/data/$f"
            fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Update Kalshi weather paper scan"
            git push
          fi

      - name: Summarize coverage
        if: always()
        run: |
          echo "## Kalshi Weather Paper Scan" >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p=Path("automation/kalshi-weather/data/latest.json")
          if not p.exists():
              print("- No report produced")
          else:
              d=json.loads(p.read_text())
              x=d.get("discovery",{})
              print(f"- Complete pagination: {x.get('pagination_complete')}")
              print(f"- Locations: {x.get('locations_count', 0)}")
              print(f"- Events: {x.get('events', 0)}")
              print(f"- Open brackets: {x.get('open_temperature_markets', 0)}")
              print(f"- Signals: {len(d.get('qualifying_signals', []))}")
              o=d.get("observation_edge",{})
              print(f"- Observation events evaluated: {o.get('events_evaluated', 0)}")
              print(f"- Observation data failures: {len(o.get('data_failures', []))}")
              t=d.get("paper_tracking",{})
              print(f"- Cumulative paper signals: {t.get('cumulative_signals', 0)}")
              print(f"- Cumulative settled: {t.get('cumulative_settled', 0)}")
              print(f"- Cumulative paper P&L: ${t.get('cumulative_paper_pnl', 0):.4f}")
              print(f"- Coverage failures: {len(d.get('coverage_failures', []))}")
              if d.get("fatal_error"): print(f"- Fatal error: {d['fatal_error']}")
          PY
